  recorded per entry as `basis`: `artifact` means we inspected a real published file (the
  Agent Skills and agent templates in github.com/cloutdesk/agents are inspectable and were
  saved verbatim under skills/); `vendor-claim` means the provider asserts it about an
  as-yet-unpublished API and nothing could be inspected. Most REST-side entries are still
  vendor claims — no OpenAPI, no docs host, and api.cloutdesk.com does not resolve. No
  security certification or compliance program (SOC 2, ISO 27001, GDPR, PCI) is published
  anywhere on Cloutdesk's surface, so no Compliance pointer is emitted in apis.yml.
