notes: >-
  NOTHING IS SERVED. Cloutdesk publishes no /.well-known/ discovery surface on any host.
  Two hosts were probed and they fail in two different ways, both recorded below because
  the second one is a trap:

  (1) www.cloutdesk.com — the Webflow marketing site — returns a clean 404 on every
  well-known path, on /llms.txt, and on /security.txt.

  (2) dashboard.cloutdesk.com — the live Vite SPA — returns HTTP 200 with
  `content-type: text/html` on EVERY path, including /.well-known/agent-card.json,
  /.well-known/security.txt and /llms.txt. This is a single-page-app catch-all, not a
  published document. A NEGATIVE CONTROL confirms it: the invented path
  /.well-known/this-path-does-not-exist-12345 also returns 200 with the identical HTML
  shell. Every one of these is recorded as a MISS (`hit: false`) and NO WellKnown,
  SecurityTxt, or AgentCard pointer is emitted — a 200 carrying an SPA shell is not a
  document, and the agent-card path in particular must never be credited from one.

  The remaining hosts named by the provider — api.cloutdesk.com (published in its own
  repo as CLOUTDESK_API_URL), mcp.cloutdesk.com, docs.cloutdesk.com and
  developer.cloutdesk.com — do not resolve at all (NXDOMAIN), so there was nothing to
  probe. A recorded absence is valid data.
