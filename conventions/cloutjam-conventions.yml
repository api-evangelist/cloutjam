status: beta
notes: >-
  Cross-cutting semantics of Cloutdesk's announced agent-native surface (REST + MCP + CLI),
  captured from the provider's own Agent Platform page and — new this round — its public
  MIT-licensed agents repo. These remain the PROVIDER'S STATED conventions, not conventions
  read out of a retrievable contract: no OpenAPI is published, no docs host resolves, and
  the API host api.cloutdesk.com returns NXDOMAIN (re-probed 2026-08-13), so nothing below
  could be verified against a live response. What the repo adds this round is the MCP tool
  namespacing convention, the environment-variable contract, and confirmation that rate
  limits and error handling are left to the integrator.
authentication:
  style: bearer-token
  token_types:
  - name: Personal Access Token
    prefix: cd_pat_
    env_var: CLOUTDESK_AGENT_PAT
    use: power users, scripted/CLI workflows, agent runtimes
  - name: OAuth 2.1 + PKCE
    use: organization-wide installs, Claude Managed Agents one-click install
  scope_gated: true
  detail: authentication/cloutjam-authentication.yml
