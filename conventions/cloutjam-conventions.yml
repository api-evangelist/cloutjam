audit:
  audited: true
  mechanism: collaboration timeline events
  agent_tool: cloutdesk__emit_event
  claim: 'Audited everything; granular per-action attribution, full approval and rollback controls,
    complete audit trail in the human dashboard.'
  source: https://www.cloutdesk.com/agent-platform
authorization:
  row_level_security: true
  detail: 'Agents call tools with the same row-level permissions as a human teammate (RLS-enforced).'
  granular_consent: true
  sensitive_actions_separately_consented: [e-signature, email send, creator ingest]
state_model:
  durable_state_machines: true
  detail: 'Built around real-world business semantics — RLS-enforced permissions, durable state
    machines, idempotent writes, audited everything.'
  example_stages: [concept, content, live post, metrics]
mcp_conventions:
  server_config_key: cloutdesk
  tool_namespace: cloutdesk__<tool>
  namespace_note: 'The MCP server config key MUST be `cloutdesk` so tools resolve as
    `cloutdesk__<tool>`. Microsoft Agent Framework binds bare tool names via
    `tools.mcp.server: cloutdesk` instead of the prefix convention.'
  env_contract:
  - {name: CLOUTDESK_API_URL, value: 'https://api.cloutdesk.com'}
  - {name: CLOUTDESK_AGENT_PAT, value: '<pat>'}
  source: https://github.com/cloutdesk/agents/blob/main/README.md
agent_conventions:
  skill_format: Anthropic Agent Skills (SKILL.md with name/description/license frontmatter)
  template_format: Anthropic + OpenAI Codex subagent format (agent.md) and Microsoft Agent Framework
    declarative manifest (microsoft.yaml)
  project_instructions: AGENTS.md (agentsmd.net convention)
  naming:
    skills: capability-named — gerund or activity noun-phrase; never persona-suffixed
    templates: persona-named — <role>-<role-modifier>
    slug_format: lowercase, hyphens, <=64 chars
  source: https://github.com/cloutdesk/agents/blob/main/AGENTS.md
governance_controls:
- idempotent
- scope-gated
- audited
- rate-limited
- dry-runnable
- webhook + realtime
realtime:
  webhooks: true
  realtime: true
  catalog_published: false
  note: 'Webhook + Realtime is asserted as a platform guarantee, but no event catalog, payload
    schema, or AsyncAPI document is published — so no asyncapi/ artifact and no Webhooks pointer
    is emitted. The only event-shaped surface actually documented is the cloutdesk__emit_event MCP
    tool, which writes to the collab timeline rather than delivering events outbound.'
