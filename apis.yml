aid: cloutjam
name: CloutJam
description: CloutDesk (formerly CloutJam) is a 500 Global-backed, New York-based platform for modern
  influencer marketing and creator management, building open infrastructure that lets agencies, brands,
  and talent representatives run creator partnerships end-to-end - outreach, relationship management,
  content approval, contract negotiation, invoicing, reporting, and payments. Its agent-first Agent
  Platform (Beta) exposes every workflow to AI agents through an MCP server, a cursor-paginated REST
  API with RFC 7807 errors and idempotent writes, and a CLI.
