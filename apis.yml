  name: Cloutdesk Agent Platform API
  description: 'The v1 REST API behind Cloutdesk''s Agent Platform — the programmatic surface agencies, brands,
    and talent representatives use to run influencer marketing through AI agents. Cursor-paginated, URI-path
    versioned, RFC 7807 errors, idempotent writes via Idempotency-Key, dry-run on every mutation, scope-gated
    with row-level permissions, and audited to a collaboration timeline. Also projected as an MCP server (six
    published tools) and a CLI. Closed beta: the base host published by the provider does not yet resolve and
    no OpenAPI document is served.'
